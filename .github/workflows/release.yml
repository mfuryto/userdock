name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: mfuryto/sambactl
          path: sambactl
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -e ./sambactl -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - name: Build Jammy-compatible binary
        run: |
          pyinstaller --clean --onefile --name userdock --paths ./sambactl --collect-all textual --collect-submodules sambactl src/userdock/__main__.py
          mv dist/userdock dist/userdock-linux-x86_64
      - name: Build Debian package
        run: scripts/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: Create checksums
        run: sha256sum dist/userdock-linux-x86_64 dist/*.deb dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/userdock-linux-x86_64
          dist/*.deb
          dist/*.whl
          dist/*.tar.gz
          dist/SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --title "UserDock ${GITHUB_REF_NAME#v}"
          --generate-notes
          --latest
