name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - name: Build Jammy-compatible binary
        run: |
          pyinstaller --clean --onefile --name userdock --collect-all textual src/userdock/__main__.py
          mv dist/userdock dist/userdock-linux-x86_64
          sha256sum dist/userdock-linux-x86_64 dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/userdock-linux-x86_64
          dist/*.whl
          dist/*.tar.gz
          dist/SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --title "UserDock ${GITHUB_REF_NAME#v}"
          --generate-notes
          --latest

