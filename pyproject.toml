[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "userdock"
version = "1.0.3"
description = "A simple TUI/CLI for managing local Linux users and groups"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "UserDock contributors" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "textual>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pyinstaller>=6.0",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
userdock = "userdock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/userdock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
